package:
  name: stemma-site
  description: >
    A one-page demonstrator for the stemma package: DOT text in, the
    library's drawing out, beside Graphviz's own drawing of the bundled
    examples. Halogen, in the browser.
  dependencies:
    - prelude
    - aff
    - arrays
    - effect
    - either
    - foldable-traversable
    - functions
    - stemma
    - halogen
    - halogen-svg-elems
    - integers
    - maybe
    - numbers
    - ordered-collections
    - strings
    - tuples
