package:
  name: stemma-harness
  description: >
    Runs the core over a corpus of DOT files on Node and writes what it
    found, for bin/check.py to compare with what Graphviz itself reports.
  dependencies:
    - prelude
    - aff
    - argonaut-core
    - arrays
    - console
    - effect
    - either
    - foldable-traversable
    - foreign-object
    - stemma
    - maybe
    - node-buffer
    - node-fs
    - node-process
    - ordered-collections
    - strings
    - tuples
workspace:
  packageSet:
    registry: 77.13.1
  extraPackages:
    # For flow/ (the adapter to hylograph-flow-render). None of these is in
    # the package set at the version the renderer asks for.
    hylograph-flow-render: "0.3.0"
    hylograph-flow: "0.2.0"
    hylograph-graph: "0.3.1"
    hylograph-layout: "0.6.0"
    hylograph-selection: "0.6.0"
